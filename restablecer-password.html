<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Restablecer contraseña | Kakuaa Consultores</title>
<style>
:root{--azul:#1a2a5e;--verde:#2e9e5b;--gris:#f4f6fa;--borde:#e2e6ee;--rojo:#d9534f}
*{box-sizing:border-box;font-family:'Segoe UI',system-ui,Arial,sans-serif}
body{margin:0;background:var(--gris);min-height:100vh;display:flex;align-items:center;justify-content:center}
.tarjeta{background:#fff;border-radius:16px;padding:38px;width:90%;max-width:420px;box-shadow:0 10px 40px rgba(0,0,0,.1);text-align:center}
h1{font-size:1.35rem;color:var(--azul);margin:0 0 10px}
p{color:#6b7280;font-size:.9rem;line-height:1.5}
input{width:100%;padding:12px 14px;border:1px solid var(--borde);border-radius:10px;font-size:.95rem;margin:8px 0;outline:none}
input:focus{border-color:var(--verde)}
button{width:100%;border:0;border-radius:10px;padding:13px;background:var(--verde);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;margin-top:10px}
button:disabled{opacity:.6;cursor:not-allowed}
.mensaje{min-height:22px;margin-top:12px;font-size:.85rem}.error{color:var(--rojo)}.ok{color:var(--verde)}
a{display:inline-block;margin-top:18px;color:var(--azul);font-size:.85rem;text-decoration:none}
</style>
</head>
<body>
<div class="tarjeta">
<div style="font-size:2.5rem;margin-bottom:10px">🔐</div>
<h1>Crear nueva contraseña</h1>
<p>Elegí una contraseña nueva para tu cuenta. El enlace de recuperación es de un solo uso y tiene una vigencia limitada.</p>
<input id="password" type="password" placeholder="Nueva contraseña" autocomplete="new-password">
<input id="confirmar" type="password" placeholder="Confirmar contraseña" autocomplete="new-password">
<button id="btn" onclick="restablecer()">Guardar nueva contraseña</button>
<div id="mensaje" class="mensaje"></div>
<a href="login.html">Volver al inicio de sesión</a>
</div>
<script>
const API='https://backend-ruc-1.onrender.com';
const token=new URLSearchParams(window.location.search).get('token')||'';
function mostrar(texto,tipo){const m=document.getElementById('mensaje');m.textContent=texto||'';m.className='mensaje '+(tipo||'')}
async function restablecer(){
 const password=document.getElementById('password').value;
 const confirmar=document.getElementById('confirmar').value;
 const btn=document.getElementById('btn');
 mostrar('');
 if(!token){mostrar('El enlace de recuperación no es válido o está incompleto.','error');return}
 if(password!==confirmar){mostrar('Las contraseñas no coinciden.','error');return}
 btn.disabled=true;
 try{
  const resp=await fetch(API+'/api/restablecer-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,nueva_password:password,confirmar_password:confirmar})});
  const data=await resp.json();
  if(resp.ok){
   mostrar(data.message||'Contraseña actualizada correctamente.','ok');
   document.getElementById('password').value='';
   document.getElementById('confirmar').value='';
   btn.disabled=true;
  }else{mostrar(data.error||'No se pudo restablecer la contraseña.','error');btn.disabled=false}
 }catch(e){mostrar('No se pudo conectar al servidor. Intentá de nuevo.','error');btn.disabled=false}
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')restablecer()});
</script>
</body>
</html>
