<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Documentos | Kakuaa Consultores</title>
    <style>
        :root { --azul: #1a2a5e; --verde: #2e9e5b; --gris-claro: #f4f6fa; --gris-borde: #e2e6ee; --texto: #2b2f36; --texto-suave: #6b7280; --rojo: #d9534f; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, Arial, sans-serif; }
        body { background: var(--gris-claro); color: var(--texto); min-height: 100vh; }
        .header { background: var(--azul); color: #fff; padding: 0 24px; height: 64px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .header .logo { display: flex; align-items: center; gap: 12px; }
        .header .logo img { width: 42px; height: 42px; border-radius: 10px; object-fit: cover; }
        .header .logo h1 { font-size: 1.1rem; font-weight: 700; }
        .header .logo span { font-size: 0.75rem; opacity: 0.8; display: block; }
        .header .usuario { display: flex; align-items: center; gap: 12px; }
        .header .usuario .avatar-mini { width: 36px; height: 36px; border-radius: 50%; background: var(--verde); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1rem; }
        .btn-cerrar { background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.3); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
        .btn-cerrar:hover { background: rgba(255,255,255,0.25); }
        .contenido { max-width: 900px; margin: 0 auto; padding: 24px; }
        .titulo-seccion { font-size: 1.3rem; font-weight: 700; color: var(--azul); margin-bottom: 4px; }
        .subtitulo { color: var(--texto-suave); font-size: 0.9rem; margin-bottom: 20px; }
        .carpeta { background: #fff; border: 1px solid var(--gris-borde); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
        .carpeta h4 { color: var(--azul); margin-bottom: 10px; font-size: 1rem; }
        .doc-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--gris-claro); margin-bottom: 6px; font-size: 0.85rem; }
        .subcarpeta-chip { display: inline-flex; align-items: center; gap: 6px; background: #e8f0fb; color: var(--azul); padding: 4px 10px; border-radius: 16px; font-size: 0.75rem; margin: 4px; }
        .btn { border: none; border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 0.8rem; font-weight: 600; }
        .btn-azul { background: var(--azul); color: #fff; }
        .btn-azul:hover { opacity: 0.88; }
        .sin-datos { text-align: center; color: var(--texto-suave); padding: 40px; font-size: 0.9rem; }
        .aviso { background: #fff8e6; border: 1px solid #f0ad4e; color: #8a6d3b; padding: 12px 16px; border-radius: 10px; font-size: 0.85rem; margin-bottom: 20px; }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="logo.png" alt="Kakuaa" onerror="this.style.display='none'">
            <div>
                <h1>Kakuaa Consultores</h1>
                <span>Mis Documentos</span>
            </div>
        </div>
        <div class="usuario">
            <div class="avatar-mini" id="avatar-mini">C</div>
            <button class="btn-cerrar" onclick="cerrarSesion()">Cerrar sesión</button>
        </div>
    </header>

    <div class="contenido">
        <h2 class="titulo-seccion" id="bienvenida">Hola</h2>
        <p class="subtitulo">Estos son los documentos que Kakuaa Consultores tiene para vos.</p>
        <div class="aviso" id="aviso" style="display:none"></div>
        <div id="carpetas"></div>
    </div>

    <script>
        const API = 'https://backend-ruc-1.onrender.com';
function fetchApi(input, init={}) { const headers=new Headers(init.headers||{}); const method=(init.method||'GET').toUpperCase(); const csrf=localStorage.getItem('csrf_token')||''; if(!['GET','HEAD','OPTIONS'].includes(method) && csrf) headers.set('X-CSRF-Token',csrf); return fetch(input,{...init,headers,credentials:'include'}); }

        const CARPETAS_FIJAS = ['Declaraciones', 'Balances', 'Estados de Cuentas', 'Facturas'];

        async function restaurarSesion() {
            try {
                const resp = await fetchApi(API + '/api/sesion');
                if (!resp.ok) throw new Error('sesion_invalida');
                const data = await resp.json();
                if (!data.usuario) throw new Error('sesion_invalida');
                sessionStorage.setItem('usuario', JSON.stringify(data.usuario));
                return true;
            } catch (e) {
                localStorage.removeItem('csrf_token');
                sessionStorage.removeItem('usuario');
                window.location.href = 'login.html';
                return false;
            }
        }

        function verificarSesion() {
            const usuario = sessionStorage.getItem('usuario'); if (!usuario) { window.location.href = 'login.html'; return false; }
            return true;
        }

        function getUsuario() {
            try { return JSON.parse(sessionStorage.getItem('usuario') || 'null'); }
            catch (e) { return null; }
        }

        async function cargarDocumentos() {
            if (!verificarSesion()) return;
            const usuario = getUsuario();
            if (usuario && usuario.nombre) {
                document.getElementById('bienvenida').textContent = 'Hola, ' + usuario.nombre;
                document.getElementById('avatar-mini').textContent = (usuario.nombre || 'C').charAt(0).toUpperCase();
            }
            const contenedor = document.getElementById('carpetas');
            contenedor.innerHTML = '<div class="sin-datos">Cargando...</div>';
            try {
                const resp = await fetchApi(API + '/api/mis-documentos', {
                    
                });
                if (resp.status === 401) { window.location.href = 'login.html'; return; }
                const docs = await resp.json();
                if (docs.length === 0) {
                    contenedor.innerHTML = '<div class="sin-datos">Todavía no tenés documentos cargados.</div>';
                    return;
                }
                contenedor.innerHTML = '';
                CARPETAS_FIJAS.forEach(carpeta => {
                    const docsCarpeta = docs.filter(d => d.carpeta === carpeta);
                    if (docsCarpeta.length === 0) return;
                    const div = document.createElement('div');
                    div.className = 'carpeta';
                    let html = '<h4>📁 ' + carpeta + '</h4>';
                    docsCarpeta.forEach(d => {
                        html += '<div class="doc-item"><span>' + d.nombre_archivo + '</span>' +
                            '<button class="btn btn-azul" onclick="descargarDoc(' + d.id + ')">⬇ Descargar</button></div>';
                    });
                    div.innerHTML = html;
                    contenedor.appendChild(div);
                });
            } catch (e) {
                contenedor.innerHTML = '<div class="sin-datos">Error al cargar documentos.</div>';
            }
        }

        async function descargarDoc(docId) {
            const resp = await fetchApi(API + '/api/mis-documentos/' + docId + '/descargar', {
                
            });
            if (!resp.ok) { alert('No autorizado'); return; }
            const blob = await resp.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '';
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        function cerrarSesion() {
            fetch(API + '/api/logout', { method: 'POST',  }).catch(() => {});
            localStorage.removeItem('csrf_token');
            sessionStorage.removeItem('usuario');
            window.location.href = 'login.html';
        }

        (async function iniciarDocumentos() {
            if (await restaurarSesion()) cargarDocumentos();
        })();
    </script>
</body>
</html>
