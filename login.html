<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Kakuaa Consultores</title>
    <style>
        :root { --azul: #1a2a5e; --verde: #2e9e5b; --gris-claro: #f4f6fa; --gris-borde: #e2e6ee; --texto: #2b2f36; --rojo: #d9534f; }
        * { margin: 0; padding:  ​0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, Arial, sans-serif; }
        body { background: var(--gris-claro); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .tarjeta { background: #fff; border-radius: 16px; padding: 40px; width: 90%; max-width: 420px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); text-align: center; }
        .logo { margin-bottom: 24px; }
        .logo img { max-height: 60px; }
        .logo h1 { font-size: 1.3rem; color: var(--azul); margin-top: 8px; }
        .logo p { color: #6b7280; font-size: 0.9rem; }
        input { width: 100%; padding: 12px 14px; border: 1px solid var(--gris-borde); border-radius: 10px; font-size: 0.95rem; margin-bottom: 12px; outline: none; }
        input:focus { border-color: var(--verde); }
        .btn { width: 100%; border: none; border-radius: 10px; padding: 13px; background: var(--verde); color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.88; }
        .error { color: var(--rojo); font-size: 0.85rem; margin-top: 10px; min-height: 18px; }
        .enlace { display: block; margin-top: 14px; font-size: 0.85rem; color: var(--azul); text-decoration: none; }
        .enlace:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="tarjeta">
        <div class="logo">
            <h1>Kakuaa Consultores</h1>
            <p>Iniciá sesión con tu RUC</p>
        </div>
        <input type="text" id="ruc" placeholder="RUC (ej: 80012345-6)">
        <input type="password" id="password" placeholder="Contraseña">
        <button class="btn" onclick="iniciarSesion()">Entrar</button>
        <div class="error" id="mensaje"></div>
        <a class="enlace" href="solicitar-reset.html">¿Olvidó su contraseña?</a>
        <a class="enlace" href="index.html">← Volver al inicio</a>
    </div>

    <script>
        const API = 'https://backend-ruc.onrender.com';

        async function iniciarSesion() {
            const ruc = document.getElementById('ruc').value.trim();
            const password = document.getElementById('password').value;
            const msg = document.getElementById('mensaje');
            msg.textContent = '';

            if (!ruc || !password) {
                msg.textContent = 'Ingresá tu RUC y contraseña';
                return;
            }

            try {
                const resp = await fetch(API + '/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ruc, password })
                });
                const data = await resp.json();

                if (resp.ok) {
                    sessionStorage.setItem('token', data.token);
                    sessionStorage.setItem('usuario', JSON.stringify(data.usuario));

                    // Si debe cambiar la contraseña, redirigí a la pantalla obligatoria
                    if (data.debe_cambiar) {
                        window.location.href = 'cambiar-password.html';
                    } else {
                        window.location.href = 'panel.html';
                    }
                } else {
                    msg.textContent = data.error || 'Error al iniciar sesión';
                }
            } catch (e) {
                msg.textContent = 'No se pudo conectar al servidor. Intentá de nuevo.';
            }
        }

        // Enter envía el formulario
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') iniciarSesion();
        });
    </script>
</body>
</html>
