<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar Sesión | Kakuaa Consultores</title>
<style>
:root{--azul:#1a2a5e;--verde:#2e9e5b;--gris:#f4f6fa;--borde:#e2e6ee;--rojo:#d9534f}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,Arial,sans-serif}
body{background:var(--gris);min-height:100vh;display:flex;align-items:center;justify-content:center}
.tarjeta{background:#fff;border-radius:16px;padding:40px;width:90%;max-width:420px;box-shadow:0 10px 40px rgba(0,0,0,.1);text-align:center}
.logo{margin-bottom:24px}.logo h1{font-size:1.3rem;color:var(--azul)}.logo p{color:#6b7280;font-size:.9rem;margin-top:8px}
input{width:100%;padding:12px 14px;border:1px solid var(--borde);border-radius:10px;font-size:.95rem;margin-bottom:12px;outline:none}input:focus{border-color:var(--verde)}
.btn{width:100%;border:0;border-radius:10px;padding:13px;background:var(--verde);color:#fff;font-size:1rem;font-weight:700;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}
.error{color:var(--rojo);font-size:.85rem;margin-top:10px;min-height:18px}.info{color:#4b5563;font-size:.85rem;margin:8px 0 14px}.enlace{display:block;margin-top:14px;font-size:.85rem;color:var(--azul);text-decoration:none}.enlace:hover{text-decoration:underline}
.otp{display:none}.codigo-box{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0 14px}.codigo{min-width:150px;padding:12px 16px;border:2px dashed #b8c0d4;border-radius:10px;background:#f8f9fc;color:var(--azul);font-size:1.65rem;font-weight:800;letter-spacing:9px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;user-select:none}.btn-refresh{width:44px;height:44px;border:1px solid var(--borde);border-radius:10px;background:#fff;color:var(--azul);font-size:1.2rem;cursor:pointer}.otp input{text-align:center;letter-spacing:10px;font-size:1.4rem;font-weight:700}.contador{font-size:.85rem;color:#6b7280;margin:4px 0 12px}
</style>
</head>
<body>
<div class="tarjeta">
<div class="logo"><h1>Kakuaa Consultores</h1><p>Acceso al sistema</p></div>
<div id="loginBox">
<input type="text" id="usuario" placeholder="Usuario" autocomplete="username">
<input type="password" id="password" placeholder="Contraseña" autocomplete="current-password">
<button class="btn" id="btnLogin" onclick="iniciarSesion()">Entrar</button>
</div>
<div id="otpBox" class="otp">
<div class="info">Ingresá el código de seguridad que aparece abajo.</div>
<div class="codigo-box" aria-label="Código de seguridad">
<div class="codigo" id="codigoVisual">----</div>
<button type="button" class="btn-refresh" id="btnNuevoCodigo" onclick="reenviarOTP()" aria-label="Generar nuevo código">↻</button>
</div>
<input type="text" id="otp" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off" aria-label="Código de seguridad">
<div class="contador" id="contador">Código válido durante 60 segundos.</div>
<button class="btn" id="btnOtp" onclick="verificarOTP()">Continuar</button>
</div>
<div class="error" id="mensaje"></div>
<a class="enlace" href="solicitar-reset.html">¿Olvidó su contraseña?</a>
<a class="enlace" href="index.html">← Volver al inicio</a>
</div>
<script>
const API='https://backend-ruc-1.onrender.com';
function fetchApi(input, init={}) { const headers=new Headers(init.headers||{}); const method=(init.method||'GET').toUpperCase(); const csrf=sessionStorage.getItem('csrf_token')||''; if(!['GET','HEAD','OPTIONS'].includes(method) && csrf) headers.set('X-CSRF-Token',csrf); return fetch(input,{...init,headers,credentials:'include'}); }
let challenge='';
let intervalo=null;
let regeneracionesRestantes=5;
function mensaje(t){document.getElementById('mensaje').textContent=t||''}
function iniciarContador(){let restante=60;const el=document.getElementById('contador');clearInterval(intervalo);intervalo=setInterval(()=>{restante--;el.textContent=restante>0?'Código válido durante '+restante+' segundos.':'El código venció. Generá uno nuevo.';if(restante<=0)clearInterval(intervalo)},1000)}
function mostrarCodigo(codigo){document.getElementById('codigoVisual').textContent=codigo||'----';document.getElementById('otp').value='';iniciarContador()}
async function iniciarSesion(){
const usuario=document.getElementById('usuario').value.trim(),password=document.getElementById('password').value;
mensaje('');if(!usuario||!password){mensaje('Ingresá tu usuario y contraseña');return}
document.getElementById('btnLogin').disabled=true;
try{const resp=await fetchApi(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario,password})});const data=await resp.json();
if(resp.ok&&data.requiere_otp){challenge=data.challenge;mostrarCodigo(data.codigo);document.getElementById('loginBox').style.display='none';document.getElementById('otpBox').style.display='block';document.getElementById('otp').focus();mensaje('')}
else{mensaje(data.error||'Error al iniciar sesión')}
}catch(e){mensaje('No se pudo conectar al servidor. Intentá de nuevo.')}finally{document.getElementById('btnLogin').disabled=false}
}
async function verificarOTP(){
const otp=document.getElementById('otp').value.trim();mensaje('');
if(!/^\d{4}$/.test(otp)){mensaje('Ingresá los 4 dígitos del código');return}
document.getElementById('btnOtp').disabled=true;
try{const resp=await fetchApi(API+'/api/login/verify-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({challenge,otp})});const data=await resp.json();
if(resp.ok){sessionStorage.setItem('csrf_token',data.csrf_token||'');sessionStorage.setItem('usuario',JSON.stringify(data.usuario));if(data.debe_cambiar){window.location.href='cambiar-password.html';}else if(data.usuario.rol==='superadmin'||data.usuario.rol==='admin'||data.usuario.rol==='operativo')window.location.href='panel.html';else window.location.href='mis-documentos.html'}
else{mensaje(data.error||'Código incorrecto');if(data.bloqueado||data.vencido)document.getElementById('btnOtp').disabled=true}
}catch(e){mensaje('No se pudo verificar el código. Intentá de nuevo.')}finally{if(!document.getElementById('btnOtp').disabled)document.getElementById('btnOtp').disabled=false}
}
async function reenviarOTP(){
mensaje('');const btn=document.getElementById('btnNuevoCodigo');btn.disabled=true;
try{const resp=await fetchApi(API+'/api/login/resend-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({challenge})});const data=await resp.json();
if(resp.ok){challenge=data.challenge;regeneracionesRestantes=data.regeneraciones_restantes ?? Math.max(0,regeneracionesRestantes-1);mostrarCodigo(data.codigo);mensaje('Se generó un nuevo código. Te quedan '+regeneracionesRestantes+' cambios disponibles.')}
else{mensaje(data.error||'No se pudo generar un nuevo código.')}
}catch(e){mensaje('No se pudo conectar al servidor.')}finally{btn.disabled=regeneracionesRestantes<=0}
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(document.getElementById('otpBox').style.display==='block')verificarOTP();else iniciarSesion()}});
</script>
</body></html>
