<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contraseña | Kakuaa Consultores</title>
    <style>
        :root { --azul: #1a2a5e; --verde: #2e9e5b; --gris-claro: #f4f6fa; --gris-borde: #e2e6ee; --texto: #2b2f36; --rojo: #d9534f; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, Arial, sans-serif; }
        body { background: var(--gris-claro); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .tarjeta { background: #fff; border-radius: 16px; padding: 40px; width: 90%; max-width: 420px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); text-align: center; }
        .icono { font-size: 3rem; margin-bottom: 12px; }
        .tarjeta h1 { font-size: 1.4rem; color: var(--azul); margin-bottom: 8px; }
        .tarjeta p { color: #6b7280; font-size: 0.9rem; margin-bottom:  ​20px; }
        input { width: 100%; padding: 12px 14px; border: 1px solid var(--gris-borde); border-radius: 10px; font-size: 0.95rem; margin-bottom: 12px; outline: none; }
        input:focus { border-color: var(--verde); }
        .btn { width: 100%; border: none; border-radius: 10px; padding: 13px; background: var(--verde); color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.88; }
        .requisitos { text-align: left; font-size: 0.8rem; color: #6b7280; margin-bottom: 20px; padding: 12px; background: var(--gris-claro); border-radius:  ​10px; }
        .requisitos li { margin-bottom: 4px; }
        .error { color: var(--rojo); font-size: 0.8rem; margin-top: 10px; min-height:  ​18px; }
        .ok { color: var(--verde); font-size: 0.85rem; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="tarjeta">
        <div class="icono">🔒</div>
        <h1>Cambiar contraseña</h1>
        <p>Por seguridad, debés crear una nueva contraseña antes de continuar.</p>
        <input type="password" id="nueva-pass" placeholder="Nueva contraseña">
        <input type="password" id="confirmar-pass" placeholder="Confirmar contraseña">
        <ul class="requisitos">
            <li>Mínimo 6 caracteres</li>
            <li>Al menos una letra mayúscula</li>
            <li>Al menos un número</li>
            <li>Al menos un carácter especial (!@#$%&*)</li>
        </ul>
        <button class="btn" onclick="cambiarPassword()">Guardar contraseña</button>
        <div class="error" id="mensaje"></div>
    </div>

    <script>
        const API = 'https://backend-ruc.onrender.com';

        function getToken() { return sessionStorage.getItem('token') || ''; }

        // Si no hay token, volvé al login
        if (!getToken()) {
            window.location.href = 'login.html';
        }

        function validarPolitica(pass) {
            if (pass.length < 6) return 'Debe tener al menos 6 caracteres';
            if (!/[A-Z]/.test(pass)) return 'Debe tener al menos una mayúscula';
            if (!/[0-9]/.test(pass)) return 'Debe tener al menos un número';
            if (!/[^A-Za-z0-9]/.test(pass)) return 'Debe tener al menos un carácter especial';
            return '';
        }

        async function cambiarPassword() {
            const actual = document.getElementById('actual-pass').value;
            const pass = document.getElementById('nueva-pass').value;
            const confirmar = document.getElementById('confirmar-pass').value;
            const msg = document.getElementById('mensaje');

            if (!actual) { msg.textContent = 'Ingresá tu contraseña actual'; msg.className = 'error'; return; }
            const error = validarPolitica(pass);
            if (error) { msg.textContent = error; msg.className = 'error'; return; }
            if (pass !== confirmar) { msg.textContent = 'Las contraseñas no coinciden'; msg.className = 'error'; return; }

            try {
                const resp = await fetch(API + '/api/cambiar-password', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password_actual: actual, nueva_password: pass })
                });
                const data = await resp.json();

                if (resp.ok) {
                    msg.textContent = '✓ Contraseña actualizada. Volvé a iniciar sesión.';
                    msg.className = 'ok';
                    sessionStorage.clear();
                    setTimeout(() => { window.location.href = 'login.html'; }, 1500);
                } else {
                    msg.textContent = data.error || 'Error al cambiar la contraseña';
                    msg.className = 'error';
                }
            } catch (e) {
                msg.textContent = 'No se pudo conectar al servidor. Intentá de nuevo.';
                msg.className = 'error';
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') cambiarPassword();
        });
    </script>
</body>
</html>
