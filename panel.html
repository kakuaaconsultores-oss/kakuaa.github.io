<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Kakuaa Consultores</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #f4f6f9; color: #1a2a5e; }
        header { background: #1a2a5e; color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 1.2rem; }
        header .user-info { display: flex; align-items: center; gap: 12px; }
        .btn { background: #2e9e5b; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
        .btn:hover { opacity: 0.9; }
        .btn-danger { background: #d9534f; }
        .btn-warning { background: #f0ad4e; }
        .btn-small { padding: 4px 10px; font-size: 0.8rem; }
        .container { max-width: 1200px; margin: 24px auto; padding: 0 16px; }
        .card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .card h2 { margin-bottom: 16px; font-size: 1.1rem; }
        .grid-usuarios { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .tarjeta-usuario { background: #fff; border: 1px solid #e0e4ee; border-radius: 10px; padding: 16px; transition: all 0.2s; }
        .tarjeta-usuario:hover { border-color: #2e9e5b; box-shadow: 0 4px 12px rgba(46,158,91,0.15); }
        .tarjeta-usuario .avatar { width: 48px; height: 48px; border-radius: 50%; background: #1a2a5e; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; }
        .tarjeta-usuario h3 { font-size: 1rem; margin-bottom: 4px; }
        .tarjeta-usuario p { font-size: 0.85rem; color: #666; margin: 2px 0; }
        .tarjeta-usuario .estado { font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; display: inline-block; margin-top: 6px; }
        .estado-activo { background: #e6f7ee; color: #2e9e5b; }
        .estado-inactivo { background: #fdeaea; color: #d9534f; }
        .form-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
        .form-row input, .form-row select { flex: 1; min-width: 150px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; }
        .acciones { display: flex; gap: 6px; }
        .carpetas { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-top: 16px; }
        .carpeta { background: #f8f9fc; border-radius: 8px; padding: 14px; border: 1px solid #e0e4ee; }
        .carpeta h4 { color: #1a2a5e; margin-bottom: 8px; font-size: 0.95rem; }
        .subcarpetas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .subcarpeta { background: #fff; border: 1px solid #d5dae5; border-radius: 12px; padding: 4px 10px; font-size: 0.8rem; display: flex; align-items: center; gap: 6px; }
        .subcarpeta button { background: none; border: none; color: #d9534f; cursor: pointer; font-size: 0.9rem; }
        .doc-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #f0f0f0; font-size: 0.85rem; }
        .doc-item .acciones { gap: 4px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #fff; padding: 24px; border-radius: 10px; width: 90%; max-width: 500px; }
        .modal-content h3 { margin-bottom: 16px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
        .oculto { display: none; }
        .volver { background: none; border: none; color: #1a2a5e; cursor: pointer; font-size: 0.9rem; margin-bottom: 12px; text-decoration: underline; }
        .select-carpeta { padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
        /* Estilos tickets */
        .ticket { border: 1px solid #e0e4ee; border-radius: 8px; padding: 14px; margin-bottom: 12px; background: #f8f9fc; }
        .ticket.pendiente { border-left: 4px solid #f0ad4e; }
        .ticket.aprobado { border-left: 4px solid #2e9e5b; }
        .ticket.rechazado { border-left: 4px solid #d9534f; opacity: 0.7; }
        .ticket .ticket-info { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .ticket .ticket-info strong { color: #1a2a5e; }
        .ticket .ticket-info span { color: #666; font-size: 0.85rem; }
        .badge { padding: 3px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
        .badge-pendiente { background: #fdf3e3; color: #b8860b; }
        .badge-aprobado { background: #e6f7ee; color: #2e9e5b; }
        .badge-rechazado { background: #fdeaea; color: #d9534f; }
        .ticket .acciones { margin-top: 10px; }
        .ticket input[type="password"] { padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.85rem; margin-right: 8px; width: 180px; }
        .sin-tickets { color: #888; font-size: 0.9rem; padding: 12px 0; }
    </style>
</head>
<body>
    <header>
        <h1>Kakuaa Consultores</h1>
        <div class="user-info">
            <span>Administrador</span>
            <button class="btn" onclick="cerrarSesion()">Cerrar sesión</button>
        </div>
    </header>

    <div class="container">
        <!-- Tickets de recuperación -->
        <div class="card">
            <h2>🔑 Tickets de recuperación de contraseña</h2>
            <div id="lista-tickets">
                <div class="sin-tickets">Cargando tickets...</div>
            </div>
        </div>

        <div id="vista-principal">
            <div class="card">
                <h2>Crear usuario</h2>
                <div class="form-row">
                    <input type="text" id="nuevo-ruc" placeholder="RUC (ej: 80012345-6)">
                    <input type="text" id="nuevo-correo" placeholder="correo@ejemplo.com">
                    <input type="text" id="nuevo-nombre" placeholder="Nombre del usuario">
                    <input type="text" id="nuevo-contrasena" placeholder="Contraseña inicial">
                    <button class="btn" onclick="crearUsuario()">Crear usuario</button>
                </div>
            </div>

            <div class="card">
                <h2>Contribuyentes</h2>
                <div class="grid-usuarios" id="grid-usuarios"></div>
            </div>
        </div>

        <div id="detalle-usuario" class="oculto">
            <button class="volver" onclick="volverAtras()">← Volver al panel</button>
            <div class="card">
                <div id="info-usuario"></div>
            </div>
            <div class="card">
                <h2>Subir documento</h2>
                <div class="form-row">
                    <input type="file" id="archivo-subir">
                    <select class="select-carpeta" id="carpeta-subir"></select>
                    <select class="select-carpeta" id="subcarpeta-subir"></select>
                    <button class="btn" onclick="subirDocumento()">Subir</button>
                </div>
            </div>
            <div class="card">
                <h2>Crear subcarpeta</h2>
                <div class="form-row">
                    <select class="select-carpeta" id="carpeta-nueva-sub"></select>
                    <input type="text" id="nombre-subcarpeta" placeholder="Nombre de la subcarpeta (ej: 2025)">
                    <button class="btn" onclick="crearSubcarpeta()">Crear</button>
                </div>
            </div>
            <div class="card">
                <h2>Carpetas</h2>
                <div class="carpetas" id="carpetas-usuario"></div>
            </div>
        </div>
    </div>

    <div class="modal" id="modal-editar">
        <div class="modal-content">
            <h3>Editar usuario</h3>
            <div class="form-row"><input type="text" id="editar-ruc" placeholder="RUC"></div>
            <div class="form-row"><input type="text" id="editar-correo" placeholder="Correo"></div>
            <div class="form-row"><input type="text" id="editar-nombre" placeholder="Nombre"></div>
            <div class="modal-actions">
                <button class="btn btn-danger" onclick="cerrarModal()">Cancelar</button>
                <button class="btn" onclick="guardarEdicion()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        const API = 'https://backend-ruc.onrender.com';
        const RUC_ADMIN = '80000000-0';
        let usuarioSeleccionado = null;
        let docsActuales = [];
        let subsActuales = [];
        const CARPETAS_FIJAS = ['Declaraciones', 'Balances', 'Estados de Cuentas', 'Facturas'];

        function getToken() { return RUC_ADMIN; }

        // ===== TICKETS DE RECUPERACIÓN =====
        async function cargarTickets() {
            const contenedor = document.getElementById('lista-tickets');
            try {
                const resp = await fetch(API + '/api/admin/tickets', {
                    headers: { 'Authorization': 'Bearer ' + getToken() }
                });
                const tickets = await resp.json();
                if (tickets.length === 0) {
                    contenedor.innerHTML = '<div class="sin-tickets">No hay tickets pendientes.</div>';
                    return;
                }
                contenedor.innerHTML = '';
                tickets.forEach(t => {
                    const div = document.createElement('div');
                    div.className = 'ticket ' + t.estado;
                    const badge = t.estado === 'pendiente' ? '<span class="badge badge-pendiente">Pendiente</span>'
                        : t.estado === 'aprobado' ? '<span class="badge badge-aprobado">Aprobado</span>'
                        : '<span class="badge badge-rechazado">Rechazado</span>';
                    let acciones = '';
                    if (t.estado === 'pendiente') {
                        acciones = `
                            <div class="acciones">
                                <input type="password" id="nueva-pass-${t.id}" placeholder="Nueva contraseña (mín 6)">
                                <button class="btn btn-small" onclick="aprobarTicket(${t.id})">Aprobar y enviar</button>
                                <button class="btn btn-small btn-danger" onclick="rechazarTicket(${t.id})">Rechazar</button>
                            </div>
                        `;
                    }
                    div.innerHTML = `
                        <div class="ticket-info">
                            <div>
                                <strong>${t.nombre}</strong> <span>(${t.ruc})</span><br>
                                <span>${t.correo}</span>
                            </div>
                            ${badge}
                        </div>
                        <div style="font-size:0.8rem;color:#999;margin-top:6px;">Solicitado: ${t.creado_en}</div>
                        ${acciones}
                    `;
                    contenedor.appendChild(div);
                });
            } catch (e) {
                contenedor.innerHTML = '<div class="sin-tickets">Error al cargar tickets.</div>';
            }
        }

        async function aprobarTicket(ticketId) {
            const nuevaPass = document.getElementById('nueva-pass-' + ticketId).value;
            if (!nuevaPass || nuevaPass.length < 6) {
                alert('Ingresá una contraseña de al menos 6 caracteres');
                return;
            }
            if (!confirm('¿Aprobar este ticket y enviar la nueva contraseña por correo?')) return;
            const resp = await fetch(API + '/api/admin/tickets/' + ticketId + '/aprobar', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' },
                body: JSON.stringify({ nueva_password: nuevaPass })
            });
            const data = await resp.json();
            if (resp.ok) {
                alert('Ticket aprobado. Contraseña actualizada' + (data.message.includes('correo') ? ' y correo enviado.' : '.'));
                cargarTickets();
            } else {
                alert(data.error || 'Error al aprobar');
            }
        }

        async function rechazarTicket(ticketId) {
            if (!confirm('¿Rechazar este ticket?')) return;
            const resp = await fetch(API + '/api/admin/tickets/' + ticketId + '/rechazar', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + getToken() }
            });
            if (resp.ok) { cargarTickets(); } else { alert('Error al rechazar'); }
        }

        // ===== USUARIOS =====
        async function cargarUsuarios() {
            const resp = await fetch(API + '/api/admin/usuarios', {
                headers: { 'Authorization': 'Bearer ' + getToken() }
            });
            const usuarios = await resp.json();
            const grid = document.getElementById('grid-usuarios');
            grid.innerHTML = '';
            usuarios.forEach(u => {
                const tarjeta = document.createElement('div');
                tarjeta.className = 'tarjeta-usuario';
                const inicial = (u.nombre || '?').charAt(0).toUpperCase();
                const estado = u.activo ? '<span class="estado estado-activo">Activo</span>' : '<span class="estado estado-inactivo">Inactivo</span>';
                tarjeta.innerHTML = `
                    <div class="avatar">${inicial}</div>
                    <h3>${u.nombre}</h3>
                    <p>RUC: ${u.ruc}</p>
                    <p>${u.correo}</p>
                    ${estado}
                    <div class="acciones" style="margin-top:10px;">
                        <button class="btn btn-small" onclick="verDetalle(${u.id})">Ver carpeta</button>
                        <button class="btn btn-small" onclick="abrirEditar(${u.id})">Editar</button>
                        <button class="btn btn-small btn-warning" onclick="resetearPass(${u.id})">Reset pass</button>
                        <button class="btn btn-small btn-danger" onclick="cambiarEstado(${u.id}, ${u.activo ? 0 : 1})">${u.activo ? 'Deshabilitar' : 'Habilitar'}</button>
                    </div>
                `;
                grid.appendChild(tarjeta);
            });
        }

        async function resetearPass(usuarioId) {
            const nuevaPass = prompt('Ingresá la nueva contraseña (mínimo 6 caracteres):');
            if (!nuevaPass || nuevaPass.length < 6) { alert('Contraseña inválida'); return; }
            const resp = await fetch(API + '/api/admin/usuarios/' + usuarioId + '/reset-password', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' },
                body: JSON.stringify({ nueva_password: nuevaPass })
            });
            const data = await resp.json();
            if (resp.ok) {
                alert('Contraseña actualizada' + (data.message.includes('correo') ? ' y correo enviado.' : '.'));
            } else {
                alert(data.error || 'Error');
            }
        }

        async function verDetalle(usuarioId) {
            usuarioSeleccionado = usuarioId;
            document.getElementById('vista-principal').classList.add('oculto');
            document.getElementById('detalle-usuario').classList.remove('oculto');
            const resp = await fetch(API + '/api/admin/usuarios/' + usuarioId + '/documentos', {
                headers: { 'Authorization': 'Bearer ' + getToken() }
            });
            docsActuales = await resp.json();
            const respSubs = await fetch(API + '/api/admin/usuarios/' + usuarioId + '/subcarpetas', {
                headers: { 'Authorization': 'Bearer ' + getToken() }
            });
            subsActuales = await respSubs.json();
            const respUsu = await fetch(API + '/api/admin/usuarios', {
                headers: { 'Authorization': 'Bearer ' + getToken() }
            });
            const usuarios = await respUsu.json();
            const usu = usuarios.find(u => u.id === usuarioId);
            document.getElementById('info-usuario').innerHTML = `
                <h2>${usu.nombre}</h2>
                <p><strong>RUC:</strong> ${usu.ruc}</p>
                <p><strong>Correo:</strong> ${usu.correo}</p>
                <p><strong>Estado:</strong> ${usu.activo ? 'Activo' : 'Inactivo'}</p>
            `;
            llenarSelectores();
            renderizarCarpetas();
        }

        function llenarSelectores() {
            const selCarpeta = document.getElementById('carpeta-subir');
            selCarpeta.innerHTML = '';
            CARPETAS_FIJAS.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                selCarpeta.appendChild(opt);
            });
            const selCarpetaNueva = document.getElementById('carpeta-nueva-sub');
            selCarpetaNueva.innerHTML = '';
            CARPETAS_FIJAS.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                selCarpetaNueva.appendChild(opt);
            });
            actualizarSubcarpetasSelect();
        }

        function actualizarSubcarpetasSelect() {
            const carpetaSel = document.getElementById('carpeta-subir').value;
            const selSub = document.getElementById('subcarpeta-subir');
            selSub.innerHTML = '';
            const opt = document.createElement('option');
            opt.value = '';
            opt.textContent = '— Sin subcarpeta —';
            selSub.appendChild(opt);
            subsActuales.filter(s => s.carpeta === carpetaSel && s.padre === '').forEach(s => {
                const o = document.createElement('option');
                o.value = s.nombre;
                o.textContent = s.nombre;
                selSub.appendChild(o);
            });
        }

        function renderizarCarpetas() {
            const contenedor = document.getElementById('carpetas-usuario');
            contenedor.innerHTML = '';
            CARPETAS_FIJAS.forEach(carpeta => {
                const div = document.createElement('div');
                div.className = 'carpeta';
                const docsCarpeta = docsActuales.filter(d => d.carpeta === carpeta);
                const subsCarpeta = subsActuales.filter(s => s.carpeta === carpeta && s.padre === '');
                let html = `<h4>📁 ${carpeta}</h4>`;
                html += `<div class="subcarpetas">`;
                subsCarpeta.forEach(s => {
                    html += `<span class="subcarpeta">${s.nombre} <button onclick="eliminarSubcarpeta('${s.nombre}')">✕</button></span>`;
                });
                html += `</div>`;
                html += `<div class="docs">`;
                docsCarpeta.filter(d => d.subcarpeta === '' && d.subcarpeta2 === '').forEach(d => {
                    html += `<div class="doc-item"><span>${d.nombre_archivo}</span><div class="acciones"><button class="btn btn-small" onclick="descargarDoc(${d.id})">⬇</button><button class="btn btn-small btn-danger" onclick="eliminarDoc(${d.id})">🗑</button></div></div>`;
                });
                html += `</div>`;
                subsCarpeta.forEach(s => {
                    const docsSub = docsCarpeta.filter(d => d.subcarpeta === s.nombre && d.subcarpeta2 === '');
                    const subsHijas = subsActuales.filter(x => x.carpeta === carpeta && x.padre === s.nombre);
                    if (docsSub.length > 0 || subsHijas.length > 0) {
                        html += `<div style="margin-left:16px;margin-top:8px;"><strong>↳ ${s.nombre}:</strong>`;
                        subsHijas.forEach(h => {
                            html += `<div style="margin-left:16px;margin-top:4px;"><em>↳ ${h.nombre}</em></div>`;
                        });
                        docsSub.forEach(d => {
                            html += `<div class="doc-item"><span>${d.nombre_archivo}</span><div class="acciones"><button class="btn btn-small" onclick="descargarDoc(${d.id})">⬇</button><button class="btn btn-small btn-danger" onclick="eliminarDoc(${d.id})">🗑</button></div></div>`;
                        });
                        html += `</div>`;
                    }
                });
                div.innerHTML = html;
                contenedor.appendChild(div);
            });
        }

        async function subirDocumento() {
            const archivo = document.getElementById('archivo-subir').files[0];
            if (!archivo) { alert('Elegí un archivo'); return; }
            const carpeta = document.getElementById('carpeta-subir').value;
            const subcarpeta = document.getElementById('subcarpeta-subir').value;
            const formData = new FormData();
            formData.append('archivo', archivo);
            formData.append('carpeta', carpeta);
            formData.append('subcarpeta', subcarpeta);
            formData.append('subcarpeta2', '');
            const resp = await fetch(API + '/api/admin/usuarios/' + usuarioSeleccionado + '/documentos', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + getToken() },
                body: formData
            });
            if (resp.ok) { verDetalle(usuarioSeleccionado); } else { alert('Error al subir'); }
        }

        async function crearSubcarpeta() {
            const carpeta = document.getElementById('carpeta-nueva-sub').value;
            const nombre = document.getElementById('nombre-subcarpeta').value.trim();
            if (!nombre) { alert('Ingresá el nombre'); return; }
            const resp = await fetch(API + '/api/admin/usuarios/' + usuarioSeleccionado + '/subcarpetas', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' },
                body: JSON.stringify({ carpeta, nombre, padre: '' })
            });
            if (resp.ok) { document.getElementById('nombre-subcarpeta').value = ''; verDetalle(usuarioSeleccionado); } else { alert('Esa subcarpeta ya existe'); }
        }

        async function eliminarSubcarpeta(nombre) {
            if (!confirm('¿Eliminar la subcarpeta y sus documentos?')) return;
            const resp = await fetch(API + '/api/admin/usuarios/' + usuarioSeleccionado + '/subcarpetas/' + encodeURIComponent(nombre), {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + getToken() }
            });
            if (resp.ok) { verDetalle(usuarioSeleccionado); }
        }

        async function eliminarDoc(docId) {
            if (!confirm('¿Eliminar este documento?')) return;
            const resp = await fetch(API + '/api/admin/documentos/' + docId, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + getToken() }
            });
            if (resp.ok) { verDetalle(usuarioSeleccionado); }
        }

        async function descargarDoc(docId) {
            const resp = await fetch(API + '/api/mis-documentos/' + docId + '/descargar', {
                headers: { 'Authorization': 'Bearer ' + getToken() }
            });
            if (!resp.ok) { alert('No autorizado'); return; }
            const blob = await resp.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '';
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        async function crearUsuario() {
            const ruc = document.getElementById('nuevo-ruc').value.trim();
            const correo = document.getElementById('nuevo-correo').value.trim();
            const nombre = document.getElementById('nuevo-nombre').value.trim();
            const contrasena = document.getElementById('nuevo-contrasena').value;
            if (!ruc || !correo || !nombre || !contrasena) { alert('Completá todos los campos'); return; }
            const resp = await fetch(API + '/api/admin/usuarios', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' },
                body: JSON.stringify({ ruc, correo, nombre, contrasena })
            });
            if (resp.ok) {
                alert('Usuario creado');
                cargarUsuarios();
                document.getElementById('nuevo-ruc').value = '';
                document.getElementById('nuevo-correo').value = '';
                document.getElementById('nuevo-nombre').value = '';
                document.getElementById('nuevo-contrasena').value = '';
            } else {
                alert('El RUC o correo ya existe');
            }
        }

        let usuarioEditando = null;
        function abrirEditar(usuarioId) {
            usuarioEditando = usuarioId;
            document.getElementById('modal-editar').style.display = 'flex';
            fetch(API + '/api/admin/usuarios', {
                headers: { 'Authorization': 'Bearer ' + getToken() }
            }).then(r => r.json()).then(usuarios => {
                const u = usuarios.find(x => x.id === usuarioId);
                document.getElementById('editar-ruc').value = u.ruc;
                document.getElementById('editar-correo').value = u.correo;
                document.getElementById('editar-nombre').value = u.nombre;
            });
        }

        function cerrarModal() { document.getElementById('modal-editar').style.display = 'none'; }

        async function guardarEdicion() {
            const ruc = document.getElementById('editar-ruc').value.trim();
            const correo = document.getElementById('editar-correo').value.trim();
            const nombre = document.getElementById('editar-nombre').value.trim();
            const resp = await fetch(API + '/api/admin/usuarios/' + usuarioEditando, {
                method: 'PUT',
                headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' },
                body: JSON.stringify({ ruc, correo, nombre })
            });
            if (resp.ok) { cerrarModal(); cargarUsuarios(); } else { alert('El RUC o correo ya existe'); }
        }

        async function cambiarEstado(usuarioId, activo) {
            const resp = await fetch(API + '/api/admin/usuarios/' + usuarioId + '/estado', {
                method: 'PUT',
                headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' },
                body: JSON.stringify({ activo: Boolean(activo) })
            });
            if (resp.ok) { cargarUsuarios(); }
        }

        function volverAtras() {
            document.getElementById('detalle-usuario').classList.add('oculto');
            document.getElementById('vista-principal').classList.remove('oculto');
            cargarUsuarios();
        }

        function cerrarSesion() { window.location.href = 'login.html'; }

        document.getElementById('carpeta-subir').addEventListener('change', actualizarSubcarpetasSelect);
        cargarTickets();
        cargarUsuarios();
    </script>
</body>
</html>
